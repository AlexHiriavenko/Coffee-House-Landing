<div class="theme-switch" role="group" aria-label="Color theme">
    <button class="theme-switch__btn" type="button" data-theme="light" aria-label="Light theme" aria-pressed="true">
        {{> shared/icons/sun }}
    </button>
    <button class="theme-switch__btn" type="button" data-theme="dark" aria-label="Dark theme" aria-pressed="false">
        {{> shared/icons/moon }}
    </button>
</div>
