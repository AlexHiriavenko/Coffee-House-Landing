<li class="card">
  <picture class="card-photo">
    <img
      src="/cards-images/coffee/coffee-{{increment @index}}.png"
      alt="{{name}}"
    />
  </picture>
  <div class="card-text-content">
    <h2 class="card-title">{{name}}</h2>
    <p class="card-description">{{description}}</p>
    <span class="card-price">${{price}}</span>
  </div>
</li>
